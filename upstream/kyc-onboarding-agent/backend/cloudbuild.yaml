# Cloud Build configuration for Backend
steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--no-cache'
      - '--platform=linux/amd64'
      - '-t'
      - 'us-central1-docker.pkg.dev/your-gcp-project/zuber-taj-repositories/kyc-onboarding-demo-backend:latest'
      - '-t'
      - 'us-central1-docker.pkg.dev/your-gcp-project/zuber-taj-repositories/kyc-onboarding-demo-backend:$BUILD_ID'
      - '.'

  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/your-gcp-project/zuber-taj-repositories/kyc-onboarding-demo-backend'

images:
  - 'us-central1-docker.pkg.dev/your-gcp-project/zuber-taj-repositories/kyc-onboarding-demo-backend:latest'
  - 'us-central1-docker.pkg.dev/your-gcp-project/zuber-taj-repositories/kyc-onboarding-demo-backend:$BUILD_ID'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'  # 20 minutes
